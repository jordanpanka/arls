services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Sqlserver!1234!"
      MSSQL_SA_PASSWORD: "Sqlserver!1234!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
    
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Sqlserver!1234!\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-password}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "miniorag"
      MINIO_ROOT_PASSWORD: "miniorag"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data

  ai:
    build: ./AI
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "docs"
      #   OLLAMA_BASE_URL=https://ollama.com/api
      #   OLLAMA_API_KEY=...
      #   GEN_MODEL_CLOUD=gpt-oss:120b-cloud
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      # call_llm() posts to {OLLAMA_BASE_URL}/generate, so this needs the /api suffix.
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434/api}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      EMBED_MODEL: "${EMBED_MODEL:-embeddinggemma:latest}"
      EMBED_MODEL_CLOUD: "${EMBED_MODEL_CLOUD:-embeddinggemma:latest}"
      GEN_MODEL: "${GEN_MODEL:-llama3:latest}"
      # call_llm() uses GEN_MODEL_CLOUD for node summaries; default to the local model.
      GEN_MODEL_CLOUD: "${GEN_MODEL_CLOUD:-llama3:latest}"
      EMBED_DIM: "${EMBED_DIM:-768}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-password}"
    extra_hosts:
      # Docker Desktop provides this automatically; this line makes Linux work too.
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
      - neo4j

  backend:
    build: ./RagApi
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=Rag;User Id=sa;Password=Sqlserver!1234!;TrustServerCertificate=True;"
      Ai__QdrantUrl: "http://qdrant:6333"
      Ai__PythonUrl: "http://ai:8000"
      Ai__OllamaUrl: "http://host.docker.internal:11434"
      Ai__Collection: "docs"
      GitHub__Token: "${GITHUB_TOKEN:-}"
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "miniorag"
      Minio__SecretKey: "miniorag"
      Minio__Bucket: "ragappdata"
      Minio__UseSsl: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sqlserver:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      ai:
        condition: service_started
    restart: on-failure

  frontend:
    build: ./ui/test
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  sqlserver_data:
  qdrant_data:
  neo4j_data:
  minio_data:
